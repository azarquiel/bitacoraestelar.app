<!DOCTYPE html>
<meta charset="utf-8">
<title>L1.3 · coste en el navegador</title>
<!--
  L1.3 del ADR 0024: ¿cuesta la TEXTURA menos que el FITS por proxy EN CALIENTE?
  Se mide en el navegador de verdad, con performance.now() y la caché de sesión
  vacía, sobre los 4 golden (M51, M101, M104, M81).

  Umbrales (ADR 0024 §Fase 1, más los dos de memoria que pide la US-3 #195):
    · tiempo de ps1LeerTextura (descarga + decodificación) ≤ tiempo del FITS;
    · bytes transferidos ≤ 0,5× los del FITS;
    · memoria por parche decodificado ≤ 16 MB; el campo de Virgo ≤ 150 MB.

  Método, y por qué así:
    · «En caliente» es el PROXY, no el navegador: cache-ps1/ se llena antes de
      medir para que el FITS no pague la ida a STScI. Es la lectura favorable al
      FITS, que es la que el listón exige.
    · Los dos caminos llevan un `cb` distinto en cada repetición, así que
      ninguno se sirve de la caché HTTP del navegador: se comparan dos descargas
      frías contra el mismo servidor. El `cb` no entra en la clave del proxy
      (ra, dec, lado, salida, banda), así que el FITS sigue saliendo de su caché.
    · Ninguna ley se reimplementa (ADR 0008): la textura la lee ps1LeerTextura y
      el FITS lo parsea parseFITS, las dos funciones de producción.
    · Los bytes salen de PerformanceResourceTiming.transferSize (cabeceras y
      cuerpo ya comprimidos), que es lo que de verdad viaja.

  Uso:  php -S localhost:8080 scripts/dev_servidor_ocular.php
        abrir http://localhost:8080/scripts/harness_l1_coste.html
        (`?reps=N` baja las repeticiones, para las pasadas con la red frenada)

  Necesita las texturas de los 4 golden en simulador_ocular/dso/: las que
  genera gen_dso_texturas.js, o una copia de las de scripts/fixtures/dso/, que
  son esas mismas y van en git. El FITS lo sirve ps1-proxy.php, que sí sale a
  STScI la primera vez.

  La tabla sale en la página y el detalle en `window.L13` (JSON, también al pie).
  La primera petición de cada objeto es el PRECALENTADO del proxy y no se mide:
  con la caché de STScI fría el FITS tardaría decenas de segundos y el listón
  quedaría ganado por la vía fácil.
-->
<body style="font:13px/1.5 ui-monospace,monospace;padding:1rem;background:#111;color:#ddd">
<pre id="salida">midiendo…</pre>
<script src="/wp-content/uploads/bitacora/bitacora-gaia-render.js"></script>
<script src="/wp-content/uploads/bitacora/bitacora-png16.js"></script>
<script src="/wp-content/uploads/bitacora/galaxias-datos.js"></script>
<script src="/wp-content/uploads/bitacora/nebulosas-datos.js"></script>
<script src="/wp-content/uploads/bitacora/dso-texturas-datos.js"></script>
<script src="/wp-content/uploads/bitacora/bitacora-ps1.js"></script>
<script>
'use strict';
var PS1 = window.BitacoraPS1, CFG = PS1.cfg;
var GOLDEN = [['NGC 5194', 'M51'], ['NGC 5457', 'M101'], ['NGC 4594', 'M104'], ['NGC 3031', 'M81']];
/* 9 repeticiones por objeto y camino, mediana. Menos no aguanta el ruido de una
   máquina de trabajo; `?reps=N` lo baja para las pasadas con la red frenada,
   donde cada repetición cuesta segundos. */
var REPETICIONES = Math.max(1, parseInt(new URLSearchParams(location.search).get('reps'), 10) || 9);

function galDe(nombre) {
  var cat = window.BITACORA_GALAXIAS, f = null, i;
  for (i = 0; i < cat.length; i++) if (cat[i][0] === nombre) { f = cat[i]; break; }
  if (!f) throw new Error('sin fila en el catálogo: ' + nombre);
  return { nombre: nombre, ra: f[2], dec: f[3], ladoArcmin: PS1.ps1LadoArcmin(f[4]) };
}

/* Lo que la red apuntó de esa URL: bytes que viajaron y cuánto duró la
   petición. transferSize vale 0 si el recurso vino de la caché HTTP; con el
   `cb` no debería pasar, y si pasa se ve como un 0 en la tabla en vez de
   colarse como un ahorro. */
function red(url) {
  var e = performance.getEntriesByName(new URL(url, location.href).href);
  var r = e.length ? e[e.length - 1] : null;
  return { bytes: r ? r.transferSize : 0, desde: r ? r.startTime : 0, hasta: r ? r.responseEnd : 0 };
}

/* La parte de RED de un camino: sus peticiones van en paralelo (el PNG y su
   sidecar), así que lo que tarda la red es el intervalo que las cubre, no la
   suma. Lo que quede del tiempo total es CPU: inflar el PNG y aplicar el
   sinh, o dar la vuelta al orden de bytes del FITS. Es la partida que decide
   la pregunta del listón —«¿cuesta la decodificación más de lo que ahorra?»— y
   por eso va desglosada. */
function redDe(urls) {
  var b = 0, desde = Infinity, hasta = 0;
  urls.forEach(function (u) {
    var r = red(u);
    b += r.bytes;
    if (r.desde < desde) desde = r.desde;
    if (r.hasta > hasta) hasta = r.hasta;
  });
  return { bytes: b, ms: hasta > desde ? hasta - desde : 0 };
}

function medirTextura(gal, cb) {
  var fila = PS1.ps1FilaTextura(gal.nombre);
  if (!fila || fila[1] !== 'imagen') {
    return Promise.reject(new Error('el manifiesto no declara textura de ' + gal.nombre));
  }
  var base = '/wp-content/uploads/bitacora/dso/' + PS1.ps1IdTextura(gal.nombre) + '.' + fila[2];
  var png = base + '.png?cb=' + cb, json = base + '.json?cb=' + cb, notas = {}, t0 = performance.now();
  return PS1.ps1LeerTextura(png, json, notas).then(function (F) {
    var ms = performance.now() - t0;
    if (!F) throw new Error('textura ilegible (' + (notas.motivo || '?') + '): ' + gal.nombre);
    var r = redDe([png, json]);
    return { ms: ms, redMs: r.ms, cpuMs: Math.max(0, ms - r.ms), bytes: r.bytes,
             ancho: F.ancho, memoria: F.datos.byteLength };
  });
}

function medirFits(gal, cb) {
  var url = PS1.ps1UrlParche(gal) + '&cb=' + cb, t0 = performance.now();
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error('ps1-proxy ' + r.status + ' en ' + gal.nombre);
    return r.arrayBuffer();
  }).then(function (buf) {
    var F = PS1.parseFITS(buf), ms = performance.now() - t0;
    if (!F) throw new Error('FITS ilegible: ' + gal.nombre);
    var r = redDe([url]);
    return { ms: ms, redMs: r.ms, cpuMs: Math.max(0, ms - r.ms), bytes: r.bytes,
             ancho: F.ancho, memoria: F.datos.byteLength };
  });
}

function mediana(v) {
  var s = v.slice().sort(function (a, b) { return a - b; });
  return s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
}

/* Una repetición mide los dos caminos seguidos, alternando cuál va primero: si
   el servidor se calienta o se cansa, que no le toque siempre al mismo. */
function medirObjeto(par) {
  var gal = galDe(par[0]), tex = [], fits = [], i = 0;
  function paso() {
    if (i >= REPETICIONES) {
      function med(v, k) { return mediana(v.map(function (m) { return m[k]; })); }
      return {
        nombre: par[0], alias: par[1],
        texturaMs: med(tex, 'ms'), fitsMs: med(fits, 'ms'),
        texturaRedMs: med(tex, 'redMs'), fitsRedMs: med(fits, 'redMs'),
        texturaCpuMs: med(tex, 'cpuMs'), fitsCpuMs: med(fits, 'cpuMs'),
        texturaBytes: med(tex, 'bytes'), fitsBytes: med(fits, 'bytes'),
        memoriaParche: tex[0].memoria, ancho: tex[0].ancho, anchoFits: fits[0].ancho,
        texturaMsTodas: tex.map(function (m) { return m.ms; }),
        fitsMsTodas: fits.map(function (m) { return m.ms; })
      };
    }
    var cb = i + '-' + Date.now(), primeroTextura = (i % 2 === 0);
    var a = primeroTextura ? medirTextura(gal, cb) : medirFits(gal, cb);
    return a.then(function (m1) {
      var b = primeroTextura ? medirFits(gal, cb) : medirTextura(gal, cb);
      return b.then(function (m2) {
        tex.push(primeroTextura ? m1 : m2);
        fits.push(primeroTextura ? m2 : m1);
        i++;
        return paso();
      });
    });
  }
  /* Precalentado, sin medir: una petición al proxy para que cache-ps1/ tenga el
     FITS de este objeto, y una lectura de la textura para que el JIT ya haya
     compilado el códec. Sin la segunda, el primer objeto de la lista paga el
     arranque del motor y sale 4× más lento que los otros tres. */
  var cb = 'precalentado-' + Date.now();
  return medirFits(gal, cb).then(function () { return medirTextura(gal, cb); }).then(paso);
}

/* El campo de Virgo no se decodifica: en la fase 1 todos los parches miden lo
   mismo (cfg.salida), así que su memoria es una multiplicación, no una medida.
   Los parches son los objetos que la capa pediría en ese campo, contados con su
   propia función (ps1GalaxiasDelCampo), no con una regla escrita aquí. */
function campoVirgo(memoriaParche) {
  var VIRGO = { ra: 187.7059, dec: 12.3911, ladoArcmin: 120 };   // M87, campo de 2°
  var enCampo = PS1.ps1GalaxiasDelCampo(window.BITACORA_GALAXIAS, VIRGO.ra, VIRGO.dec, VIRGO.ladoArcmin);
  return { objetos: enCampo.length, bytes: enCampo.length * memoriaParche };
}

function fmt(n, d) { return Number(n).toFixed(d == null ? 2 : d).replace('.', ','); }

(function () {
  var res = [], i = 0;
  function siguiente() {
    if (i >= GOLDEN.length) return res;
    return medirObjeto(GOLDEN[i]).then(function (r) { res.push(r); i++; return siguiente(); });
  }
  Promise.resolve().then(siguiente).then(function (filas) {
    /* El listón compara dos totales, pero la decisión vive en el reparto: la
       textura gana bytes y pierde CPU, así que quién gana depende del ancho de
       banda. Este es el punto donde empatan: por debajo, la textura llega
       antes; por encima, el FITS. Se informa para que el veredicto se pueda
       leer con la conexión del observador delante. */
    filas.forEach(function (f) {
      var dCpu = (f.texturaCpuMs - f.fitsCpuMs) / 1000, dBytes = f.fitsBytes - f.texturaBytes;
      f.empateMbps = dCpu > 0 ? (dBytes * 8 / dCpu) / 1e6 : Infinity;
    });
    var peorParche = Math.max.apply(null, filas.map(function (f) { return f.memoriaParche; }));
    var virgo = campoVirgo(peorParche);
    var veredicto = {
      tiempo: filas.every(function (f) { return f.texturaMs <= f.fitsMs; }),
      bytes: filas.every(function (f) { return f.texturaBytes <= 0.5 * f.fitsBytes; }),
      memoria: peorParche <= 16 * 1024 * 1024,
      virgo: virgo.bytes <= 150 * 1024 * 1024
    };
    veredicto.pasa = veredicto.tiempo && veredicto.bytes && veredicto.memoria && veredicto.virgo;
    var salida = {
      fecha: new Date().toISOString(), agente: navigator.userAgent,
      repeticiones: REPETICIONES, salida: CFG.salida,
      filas: filas, virgo: virgo, veredicto: veredicto
    };
    window.L13 = salida;
    document.getElementById('salida').textContent =
      filas.map(function (f) {
        return f.alias +
               '\ttextura ' + fmt(f.texturaMs) + ' ms (red ' + fmt(f.texturaRedMs) + ' + cpu ' + fmt(f.texturaCpuMs) + ') / ' + fmt(f.texturaBytes / 1024, 0) + ' kB' +
               '\tFITS ' + fmt(f.fitsMs) + ' ms (red ' + fmt(f.fitsRedMs) + ' + cpu ' + fmt(f.fitsCpuMs) + ') / ' + fmt(f.fitsBytes / 1024, 0) + ' kB' +
               '\t×' + fmt(f.texturaBytes / f.fitsBytes) + ' bytes, ×' + fmt(f.texturaMs / f.fitsMs) + ' tiempo' +
               '\tempatan a ' + fmt(f.empateMbps, 0) + ' Mbps';
      }).join('\n') +
      '\n\nmemoria por parche: ' + fmt(peorParche / 1048576, 2) + ' MB (tope 16)' +
      '\nVirgo: ' + virgo.objetos + ' parches · ' + fmt(virgo.bytes / 1048576, 1) + ' MB (tope 150)' +
      '\n\nL1.3: ' + (veredicto.pasa ? 'PASA' : 'NO PASA') +
      '\n\n' + JSON.stringify(salida);
  }).catch(function (e) {
    window.L13 = { error: String((e && e.message) || e) };
    document.getElementById('salida').textContent = 'ERROR: ' + ((e && e.stack) || e);
  });
}());
</script>
